<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Login | VeriText</title>


    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- MAIN CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =====================================
     NAVBAR
===================================== -->

<header class="navbar">

    <div class="nav-container">


        <!-- LOGO -->

        <a
            href="index.html"
            class="logo"
        >

            <span class="logo-icon">
                ✓
            </span>

            <span>
                Veri<span class="logo-blue">Text</span>
            </span>

        </a>


        <!-- NAVIGATION -->

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

        </nav>


    </div>

</header>



<!-- =====================================
     STUDENT LOGIN PAGE
===================================== -->

<main class="auth-page">

    <div class="auth-container">


        <!-- HEADER -->

        <div class="auth-header">

            <span class="section-tag">
                STUDENT PORTAL
            </span>

            <h1>
                Welcome back
            </h1>

            <p>
                Log in to submit your assignments
                through VeriText.
            </p>

        </div>



        <!-- LOGIN CARD -->

        <div class="auth-card">

            <form id="studentLoginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="studentLoginEmail">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="studentLoginEmail"
                        placeholder="student@example.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="studentLoginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="studentLoginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- ERROR / SUCCESS -->

                <div
                    id="studentLoginError"
                    class="auth-message"
                    aria-live="polite"
                ></div>



                <!-- LOGIN -->

                <button
                    type="submit"
                    class="primary-btn auth-submit"
                >

                    Log in

                    <span>
                        →
                    </span>

                </button>


            </form>



            <!-- SIGNUP -->

            <div class="auth-footer">

                <p>
                    Don't have a student account?
                </p>

                <a href="student-signup.html">
                    Create account
                </a>

            </div>

        </div>

    </div>

</main>



<!-- JAVASCRIPT -->

<script src="js/student-auth.js"></script>


</body>

</html>
